<style>

  * { box-sizing: border-box; }
  body {

    background: var(--paper);
    color: var(--ink);

  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 20px 64px; }
  h1 { font-size: 22px; margin: 0 0 24px; }
  .buttons { display: flex; flex-direction: column; gap: 14px; margin-bottom: 36px; }
  .btn {
    display: block;
    text-align: center;
    text-decoration: none;
    background: var(--accent);
    color: #fff;
    padding: 16px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 16px;
  }
  .btn:hover { opacity: .88; }
  .btn.secondary { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .service { background: #fff; border: 1px solid var(--rule); border-radius: 6px; padding: 22px 20px; margin-bottom: 28px; }
  .service h2 { font-size: 18px; margin: 0 0 18px; }
  .service .item { margin-bottom: 16px; }
  .service .item:last-of-type { margin-bottom: 0; }
  .service .label { font-weight: 700; font-size: 14.5px; margin: 0 0 4px; }
  .service .desc { font-size: 14px; color: var(--muted); margin: 0; }
  .service .campaign { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--rule); font-size: 14px; }
  .msg { background: #fff; border: 1px solid var(--rule); border-radius: 6px; padding: 22px 20px; font-size: 15px; }
  .msg p { margin: 0 0 14px; }
  .msg p:last-child { margin-bottom: 0; }
  .closing { font-weight: 700; font-size: 17px; margin-top: 20px; }
</style>
</head>
